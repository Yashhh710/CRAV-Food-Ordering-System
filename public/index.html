<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CRAV | Home</title>
<link rel="shortcut icon" type="image/png" href="assets/models/logo.png">
<link rel="icon" type="image/png" href="assets/models/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Montserrat:wght@800;900&display=swap" rel="stylesheet">
<style>
:root{
  --red:#D90019;--burgundy:#8F1420;--cream:#FFF9E9;--gold:#F5B900;--black:#080808;--white:#FFFFFF;
  --ease:cubic-bezier(.22,.8,.24,1);
  --u:min(1vw,1.78vh);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{
  font-family:'Poppins',system-ui,sans-serif;color:var(--black);
  background:radial-gradient(ellipse at 50% 30%,#FFFDF3 0%,var(--cream) 55%,#FBEFCF 100%);
}
.page{position:relative;contain:layout paint;height:100vh;height:100dvh;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:calc(var(--u)*1.6) 0 calc(var(--u)*1.4);overflow:hidden}

.deco{position:absolute;pointer-events:none;user-select:none;z-index:0;height:auto}
.deco.corner-tl{top:0;left:0;width:calc(var(--u)*26)}
.deco.swoosh-tl{top:0;left:0;width:calc(var(--u)*27);z-index:1}
.deco.corner-br{bottom:0;right:0;width:calc(var(--u)*29)}
.deco.swoosh-br{bottom:0;right:0;width:calc(var(--u)*29);z-index:1}

.layer{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none;z-index:1;user-select:none}
.el{position:absolute;z-index:2;width:var(--s);height:auto;pointer-events:none;user-select:none;animation:drift var(--d,9s) ease-in-out infinite;animation-delay:var(--dl,0s);will-change:transform}
@keyframes drift{0%,100%{transform:translate3d(0,0,0) rotate(var(--r,0deg))}50%{transform:translate3d(var(--dx,6px),-14px,0) rotate(calc(var(--r,0deg) + 8deg))}}

br.mb{display:none}
header{position:relative;z-index:3;text-align:center;animation:dropIn .9s var(--ease) both}
.brand{display:flex;align-items:center;justify-content:center;gap:calc(var(--u)*1.2)}
.brand img{height:calc(var(--u)*5.6);width:auto;display:block}
.brand h1{font-family:'Montserrat',sans-serif;font-weight:900;font-size:calc(var(--u)*5);color:var(--red);line-height:1;font-style:italic}
.tag{font-weight:600;font-style:italic;font-size:calc(var(--u)*1.5);margin-top:calc(var(--u)*.2)}
.underline{display:block;margin:calc(var(--u)*.2) auto 0;width:calc(var(--u)*17);height:auto}

.heading{position:relative;z-index:3;text-align:center;animation:rise 1s .25s var(--ease) both}
.heading h2{font-family:'Montserrat',sans-serif;font-weight:900;font-size:calc(var(--u)*6.3);line-height:1;letter-spacing:-.025em;color:var(--black)}
.heading h2 span{color:var(--red)}
.sub{display:flex;align-items:center;justify-content:center;gap:calc(var(--u)*2);margin-top:calc(var(--u)*1.4)}
.sub::before,.sub::after{content:"";height:1px;width:calc(var(--u)*8);background:rgba(8,8,8,.35)}
.sub p{font-weight:500;font-size:calc(var(--u)*1.45);letter-spacing:.14em;color:#3a2f2a}

.cards{position:relative;z-index:3;display:grid;grid-template-columns:1fr 1fr;gap:calc(var(--u)*3.4);width:calc(var(--u)*90);margin-top:calc(var(--u)*3)}
.card{
  position:relative;cursor:pointer;height:calc(var(--u)*18.5);border-radius:calc(var(--u)*2.8);
  display:flex;align-items:center;padding:0 calc(var(--u)*2.6);
  transition:transform .6s var(--ease),box-shadow .6s var(--ease),border-color .6s;will-change:transform;
  animation:cardIn 1s var(--ease) both;outline:none;
}
.card.burger{animation-delay:.55s;background:linear-gradient(120deg,#E8132B 0%,var(--red) 40%,#9d0e1c 100%);border:2px solid rgba(255,255,255,.6);box-shadow:0 0 0 3px rgba(217,0,25,.22),0 0 34px rgba(217,0,25,.35),0 22px 44px rgba(143,20,32,.32)}
.card.pizza{animation-delay:.8s;background:linear-gradient(120deg,#3b1410 0%,#5a1a16 45%,var(--burgundy) 100%);border:2px solid rgba(245,185,0,.55);box-shadow:0 0 0 3px rgba(245,185,0,.12),0 0 30px rgba(245,185,0,.2),0 22px 44px rgba(60,10,10,.38)}
.card::before{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(ellipse at 20% 0%,rgba(255,255,255,.2),transparent 55%);pointer-events:none}
.shine{position:absolute;inset:0;border-radius:inherit;overflow:hidden;pointer-events:none;z-index:2}
.shine::after{content:"";position:absolute;top:0;bottom:0;left:-40%;width:30%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.28),transparent);transform:skewX(-18deg);transition:left .9s var(--ease)}
.card:hover .shine::after,.card:focus-visible .shine::after{left:130%}
.card:hover,.card:focus-visible{transform:translateY(calc(var(--u)*-.8))}
.card.burger:hover,.card.burger:focus-visible{border-color:#fff;box-shadow:0 0 0 4px rgba(255,255,255,.45),0 0 56px rgba(255,60,70,.7),0 30px 54px rgba(143,20,32,.45)}
.card.pizza:hover,.card.pizza:focus-visible{border-color:var(--gold);box-shadow:0 0 0 4px rgba(245,185,0,.45),0 0 52px rgba(245,185,0,.5),0 30px 54px rgba(60,10,10,.5)}

.food{position:absolute;z-index:4;pointer-events:none;transition:transform .7s var(--ease);will-change:transform;filter:drop-shadow(0 22px 18px rgba(60,0,0,.45))}
.food img{display:block;width:100%;height:auto;animation:float 5s ease-in-out infinite}
.burger .food{left:-3%;bottom:-3%;width:62%}
.pizza .food{right:-3%;top:-16%;width:56%}
.pizza .food img{animation-delay:-2s}
.burger:hover .food,.burger:focus-visible .food{transform:scale(1.07) rotate(-2deg)}
.pizza:hover .food,.pizza:focus-visible .food{transform:scale(1.07) rotate(2deg)}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(calc(var(--u)*-.8))}}

.info{position:relative;z-index:5;width:36%;display:flex;flex-direction:column;align-items:flex-start;gap:calc(var(--u)*.7);color:var(--white);transition:transform .5s var(--ease)}
.card:hover .info{transform:translateX(calc(var(--u)*.4))}
.burger .info{margin-left:auto;margin-right:2%}
.pizza .info{margin-right:auto;margin-left:1%}
.info h3{font-family:'Montserrat',sans-serif;font-weight:800;font-size:calc(var(--u)*3.4);line-height:1}
.info p{font-size:calc(var(--u)*1.65);line-height:1.3;opacity:.95;max-width:9em}
.btn{
  display:inline-flex;align-items:center;gap:.6em;margin-top:calc(var(--u)*.5);
  border:0;cursor:pointer;font-family:inherit;font-weight:600;font-size:calc(var(--u)*1.4);color:var(--black);
  background:linear-gradient(180deg,#FFCB2B,var(--gold));padding:.8em 1.8em;border-radius:999px;min-height:44px;
  box-shadow:0 8px 16px rgba(0,0,0,.28),inset 0 2px 0 rgba(255,255,255,.5);
  transition:transform .35s var(--ease),box-shadow .35s var(--ease);
}
.arr{display:block;width:1.5em;height:1.5em;margin-left:-.1em;transition:transform .35s var(--ease)}
.btn:hover{transform:translateY(-3px) scale(1.05);box-shadow:0 14px 22px rgba(0,0,0,.35),inset 0 2px 0 rgba(255,255,255,.5)}
.btn:hover .arr{transform:translateX(5px)}
.btn:focus-visible{outline:3px solid var(--white);outline-offset:3px}

.steam{position:absolute;z-index:3;left:33%;top:-18%;width:16%;height:auto;pointer-events:none;opacity:.55;animation:steam 6s ease-in-out infinite;will-change:transform,opacity}
.pizza:hover .steam{opacity:.95}
@keyframes steam{0%,100%{transform:translateY(0) scaleX(1);opacity:.25}50%{transform:translateY(-14px) scaleX(1.2);opacity:.55}}

.bottom{position:relative;z-index:3;display:flex;align-items:center;justify-content:center;gap:calc(var(--u)*2);animation:rise 1s 1.1s var(--ease) both}
.bottom p{font-family:'Montserrat',sans-serif;font-weight:800;color:var(--burgundy);letter-spacing:.2em;font-size:calc(var(--u)*1.35);white-space:nowrap}
.bottom img{display:block;width:calc(var(--u)*14);height:auto}
.bottom img:last-child{transform:scaleX(-1)}

@keyframes dropIn{from{opacity:0;transform:translateY(-40px)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
@keyframes cardIn{from{opacity:0;transform:translateY(70px) scale(.94)}to{opacity:1;transform:none}}

@media (max-aspect-ratio:1/1){
  :root{--u:min(2.4vw,1.1vh)}
  .page{padding-top:calc(var(--u)*1.4)}
  .brand img{height:calc(var(--u)*5.4)}
  .brand h1{font-size:calc(var(--u)*4.6)}
  .tag{font-size:calc(var(--u)*1.8)}
  br.mb{display:inline}
  .heading h2{font-size:calc(var(--u)*4.8)}
  .sub p{font-size:calc(var(--u)*1.4);letter-spacing:.04em}
  .sub::before,.sub::after{width:calc(var(--u)*2)}
  .cards{grid-template-columns:1fr;width:calc(var(--u)*39);gap:calc(var(--u)*7);margin-top:calc(var(--u)*3)}
  .card{height:calc(var(--u)*19);padding:0 calc(var(--u)*2)}
  .burger .food{width:62%;left:-5%;bottom:-3%}
  .pizza .food{width:60%;right:-5%;top:-14%}
  .info{width:40%}
  .info h3{font-size:calc(var(--u)*4)}
  .info p{font-size:calc(var(--u)*1.9)}
  .btn{font-size:calc(var(--u)*1.8)}
  .bottom p{font-size:calc(var(--u)*1.5);letter-spacing:.1em}
  .bottom img{width:calc(var(--u)*5)}
  .deco.corner-tl,.deco.swoosh-tl{width:calc(var(--u)*17)}
  .deco.corner-br,.deco.swoosh-br{width:calc(var(--u)*18)}
  .underline{width:calc(var(--u)*14)}
  .el.hide-m{display:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<main class="page">
  <img class="deco corner-tl" src="assets/media/ui/corner-tl.png" alt="">
  <img class="deco swoosh-tl" src="assets/media/ui/swoosh-tl.png" alt="">
  <img class="deco corner-br" src="assets/media/ui/corner-br.png" alt="">
  <img class="deco swoosh-br" src="assets/media/ui/swoosh-br.png" alt="">

  <img class="el hide-m" src="assets/media/ui/float-tomato.png" alt="" style="--s:calc(var(--u)*6.5);top:3%;right:3%;--d:8.0s;--r:8deg;--dl:-0s">
  <img class="el" src="assets/media/ui/float-slice.png" alt="" style="--s:calc(var(--u)*5.5);top:20%;right:10%;--d:9.5s;--r:-25deg;--dl:-1s">
  <img class="el" src="assets/media/ui/float-leaf.png" alt="" style="--s:calc(var(--u)*5);top:17%;left:8%;--d:11.0s;--r:-10deg;--dl:-2s">
  <img class="el" src="assets/media/ui/float-slice.png" alt="" style="--s:calc(var(--u)*6.5);top:34%;left:1.5%;--d:12.5s;--r:20deg;--dl:-3s">
  <img class="el hide-m" src="assets/media/ui/float-leaf.png" alt="" style="--s:calc(var(--u)*4.5);top:35%;right:2%;--d:14.0s;--r:30deg;--dl:-4s">
  <img class="el" src="assets/media/ui/float-leaf.png" alt="" style="--s:calc(var(--u)*4);bottom:22%;left:1.5%;--d:8.0s;--r:40deg;--dl:-5s">
  <img class="el" src="assets/media/ui/float-tomato.png" alt="" style="--s:calc(var(--u)*6);bottom:1%;left:1%;--d:9.5s;--r:-15deg;--dl:-6s">
  <img class="el" src="assets/media/ui/float-leaf.png" alt="" style="--s:calc(var(--u)*5.5);bottom:2%;right:2.5%;--d:11.0s;--r:-35deg;--dl:-7s">
  <img class="el hide-m" src="assets/media/ui/float-olive.png" alt="" style="--s:calc(var(--u)*3.2);top:7%;left:22%;--d:12.5s;--r:0deg;--dl:-8s">
  <img class="el hide-m" src="assets/media/ui/float-olive.png" alt="" style="--s:calc(var(--u)*2.6);top:44%;right:1.5%;--d:14.0s;--r:15deg;--dl:-9s">
  <img class="el" src="assets/media/ui/float-crumb.png" alt="" style="--s:calc(var(--u)*1.8);top:30%;left:11%;--d:8.0s;--r:0deg;--dl:-10s">
  <img class="el hide-m" src="assets/media/ui/float-crumb.png" alt="" style="--s:calc(var(--u)*1.6);top:45%;left:2.5%;--d:9.5s;--r:0deg;--dl:-11s">
  <img class="el hide-m" src="assets/media/ui/float-crumb.png" alt="" style="--s:calc(var(--u)*1.9);top:41%;right:7%;--d:11.0s;--r:0deg;--dl:-12s">

  <header>
    <div class="brand">
      <img src="assets/models/logo.png" alt="CRAV logo">
      <h1>CRAV</h1>
    </div>
    <p class="tag">From Craving to Doorstep.</p>
    <img class="underline" src="assets/media/ui/brush-stroke.png" alt="">
  </header>

  <section class="heading">
    <h2>What’s Your<br><span>Today’s</span><br class="mb"> Choice?</h2>
    <div class="sub"><p>Delicious choices. Endless happiness.</p></div>
  </section>

  <section class="cards">
    <article class="card burger" data-href="burger.html" tabindex="0" role="link" aria-label="Burger – Explore">
      <div class="shine"></div>
      <div class="food"><img src="assets/models/menu/bbq-chicken-burger.png" alt="BBQ chicken burger"></div>
      <div class="info">
        <h3>Burger</h3>
        <p>Bite into Perfection.</p>
        <button class="btn" type="button" data-href="burger.html">Explore <img class="arr" src="assets/media/ui/arrow.png" alt=""></button>
      </div>
    </article>

    <article class="card pizza" data-href="pizza.html" tabindex="0" role="link" aria-label="Pizza – Explore">
      <div class="shine"></div>
      <div class="food"><img src="assets/models/menu/bbq-chicken-pizza.png" alt="BBQ chicken pizza"></div>
      <div class="info">
        <h3>Pizza</h3>
        <p>More Cheese. More Love.</p>
        <button class="btn" type="button" data-href="pizza.html">Explore <img class="arr" src="assets/media/ui/arrow.png" alt=""></button>
      </div>
    </article>
  </section>

  <footer class="bottom">
    <img src="assets/media/ui/brush-stroke.png" alt="">
    <p>From Craving to Doorstep. &bull; <a href="privacy-policy.html" style="color:#fff; text-decoration:underline; font-size:12px;">Privacy Policy</a> &bull; <a href="terms.html" style="color:#fff; text-decoration:underline; font-size:12px;">Terms &amp; Conditions</a></p>
    <img src="assets/media/ui/brush-stroke.png" alt="">
  </footer>
</main>

<script>
(function(){
  var go=function(url){window.location.href=url};
  document.querySelectorAll('.card').forEach(function(card){
    var url=card.dataset.href;
    card.addEventListener('click',function(){go(url)});
    card.addEventListener('keydown',function(e){
      if(e.key==='Enter'||e.key===' '){e.preventDefault();go(url)}
    });
    var btn=card.querySelector('.btn');
    btn.addEventListener('click',function(e){e.stopPropagation();go(btn.dataset.href)});
  });
  var els=[].slice.call(document.querySelectorAll('.el')),food=[];
  if(window.matchMedia('(hover:hover) and (min-aspect-ratio:1/1)').matches&&!window.matchMedia('(prefers-reduced-motion:reduce)').matches){
    var tx=0,ty=0,cx=0,cy=0;
    window.addEventListener('pointermove',function(e){tx=e.clientX/innerWidth-.5;ty=e.clientY/innerHeight-.5},{passive:true});
    els.forEach(function(el,i){el.dataset.k=((i%4)+1)*5});
    (function loop(){
      cx+=(tx-cx)*.06;cy+=(ty-cy)*.06;
      food.forEach(function(l){l.style.transform='translate3d('+(cx*-10)+'px,'+(cy*-10)+'px,0) scale(1.02)'});
      els.forEach(function(el){var k=+el.dataset.k;el.style.translate=(cx*-k*2)+'px '+(cy*-k*2)+'px'});
      requestAnimationFrame(loop);
    })();
  }
  document.querySelectorAll('img').forEach(function(img){
    img.addEventListener('error',function(){console.warn('Missing image: '+img.getAttribute('src'))});
  });
})();
</script>
</body>
</html>
